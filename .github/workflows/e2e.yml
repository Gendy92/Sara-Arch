name: E2E Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Write config.local.js
        run: |
          cat > js/config.local.js <<'EOF'
          window.SARA_LOCAL_CONFIG = {
            SUPABASE_URL: '${{ secrets.E2E_SUPABASE_URL }}',
            SUPABASE_ANON_KEY: '${{ secrets.E2E_SUPABASE_ANON_KEY }}'
          };
          EOF

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_SUPABASE_SERVICE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_KEY }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

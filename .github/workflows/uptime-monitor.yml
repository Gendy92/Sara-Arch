# Uptime monitor — opens an issue if the live site or its Supabase backend go down.
# Runs every 6 hours and on demand (Actions → Uptime Monitor → Run workflow).
# Requires secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (same as supabase-migrate).
name: Uptime Monitor

on:
  schedule:
    - cron: '17 */6 * * *' # 17 min past every 6th hour — avoids GitHub's top-of-hour congestion
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check site + database
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const failures = [];
            const ts = new Date().toISOString();

            // 1) Static site is up and serving the app version manifest.
            try {
              const res = await fetch('https://gendy92.github.io/Sara-Arch/version.json', { signal: AbortSignal.timeout(15000) });
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              const v = await res.json();
              if (!v || !v.version) throw new Error('version.json missing "version" field');
              core.info(`Site OK — version ${v.version}`);
            } catch (e) {
              failures.push(`Static site (GitHub Pages): ${e.message}`);
            }

            // 2) Supabase Postgres API answers a trivial query.
            const supaUrl = process.env.SUPABASE_URL;
            const supaKey = process.env.SUPABASE_SERVICE_ROLE_KEY;
            if (!supaUrl || !supaKey) {
              failures.push('Secrets SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY not configured — cannot check database');
            } else {
              try {
                const res = await fetch(`${supaUrl}/rest/v1/clients?select=id&limit=1`, {
                  headers: { apikey: supaKey, Authorization: `Bearer ${supaKey}` },
                  signal: AbortSignal.timeout(15000)
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                core.info('Database OK');
              } catch (e) {
                failures.push(`Supabase database (PostgREST): ${e.message}`);
              }
            }

            if (failures.length) {
              core.setFailed(`Uptime check failed at ${ts}:\n- ${failures.join('\n- ')}`);
              core.setOutput('failed', 'true');
              core.setOutput('detail', failures.join('\n'));
            } else {
              core.setOutput('failed', 'false');
            }
          result-encoding: string
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Open issue (deduplicated)
        if: always() && steps.check.outputs.failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const detail = `${{ steps.check.outputs.detail }}`;
            const label = 'uptime';
            const marker = '<!-- uptime-monitor -->';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 10
            });
            const existing = open.find(i => i.body && i.body.includes(marker));
            const body = `${marker}\n**Uptime check failed** at ${new Date().toISOString()}\n\n- ${detail.split('\n').join('\n- ')}\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body: `Still failing at ${new Date().toISOString()}:\n\n- ${detail.split('\n').join('\n- ')}`
              });
              core.info(`Commented on existing issue #${existing.number}`);
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: '🚨 Sara Arch uptime check failed',
                body,
                labels: [label]
              });
              core.info(`Opened issue #${issue.data.number}`);
            }

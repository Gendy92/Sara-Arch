# Emergency admin password reset — resets the web app's `admin` login.
# Runs ONLY on manual dispatch (Actions → Admin Password Reset → Run workflow).
# Requires secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (already configured).
# The RPC it calls is service_role-only (see migration_v304) — it cannot be
# invoked from the browser, and this workflow never prints the key or password.
name: Admin Password Reset

on:
  workflow_dispatch:
    inputs:
      new_password:
        description: 'New password for the admin account (min 6 chars)'
        required: true
        default: 'admin'
        type: string

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Reset admin password via service-only RPC
        uses: actions/github-script@v7
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        with:
          new_password: ${{ inputs.new_password }}
          script: |
            const pw = core.getInput('new_password') || 'admin';
            if (!pw || pw.length < 6) throw new Error('Password must be at least 6 characters');
            const res = await fetch(`${process.env.SUPABASE_URL}/rest/v1/rpc/service_reset_admin_password`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                apikey: process.env.SUPABASE_SERVICE_ROLE_KEY,
                Authorization: `Bearer ${process.env.SUPABASE_SERVICE_ROLE_KEY}`
              },
              body: JSON.stringify({ p_password: pw })
            });
            const text = await res.text();
            if (!res.ok) throw new Error(`RPC failed: HTTP ${res.status} — ${text.slice(0, 200)}`);
            const out = JSON.parse(text);
            if (!out.success) throw new Error(`RPC rejected: ${out.error}`);
            core.info('Admin password reset successfully.');

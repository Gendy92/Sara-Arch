# Emergency admin password reset — resets the web app's `admin` login.
# Runs ONLY on manual dispatch (Actions → Admin Password Reset → Run workflow).
# Requires secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (already configured).
# Uses the GoTrue admin API (service key) directly; never prints the key.
name: Admin Password Reset

on:
  workflow_dispatch:
    inputs:
      new_password:
        description: 'New password for the admin account (min 4 chars)'
        required: true
        default: 'admin'
        type: string

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Reset admin password via GoTrue admin API
        uses: actions/github-script@v7
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        with:
          new_password: ${{ inputs.new_password }}
          script: |
            const pw = core.getInput('new_password') || 'admin';
            if (pw.length < 4) throw new Error('Password must be at least 4 characters');
            const base = process.env.SUPABASE_URL;
            const headers = {
              'Content-Type': 'application/json',
              apikey: process.env.SUPABASE_SERVICE_ROLE_KEY,
              Authorization: `Bearer ${process.env.SUPABASE_SERVICE_ROLE_KEY}`
            };

            // 1) Find the admin profile (service key bypasses RLS).
            const profRes = await fetch(`${base}/rest/v1/profiles?select=id,username,email&limit=100`, { headers });
            if (!profRes.ok) throw new Error(`profiles query failed: HTTP ${profRes.status} — ${(await profRes.text()).slice(0, 200)}`);
            const profiles = await profRes.json();
            core.info(`profiles in DB: ${profiles.map(p => `${p.username}<${p.email}>`).join(', ') || '(none)'}`);
            const admin = profiles.find(p => (p.username || '').toLowerCase() === 'admin')
              || profiles.find(p => /admin/i.test(p.username || '') || /admin/i.test(p.email || ''));
            if (!admin) throw new Error('No admin-like profile found — check profiles table');

            // 2) Find the REAL auth user by email — profiles.id can be stale
            //    (that broken linkage is why login failed even with the right password).
            const listRes = await fetch(`${base}/auth/v1/admin/users?per_page=100`, { headers });
            if (!listRes.ok) throw new Error(`admin users list failed: HTTP ${listRes.status} — ${(await listRes.text()).slice(0, 200)}`);
            const users = (await listRes.json()).users || [];
            core.info(`auth users: ${users.map(u => `${u.email}<${u.id}>`).join(', ') || '(none)'}`);
            // The app never looks up profiles by username at login — Auth.toEmail()
            // synthesizes the GoTrue email as `<username>@gendy92.github.io`.
            const synthEmail = (admin.username || 'admin').toLowerCase().split('@')[0].replace(/[^a-z0-9_.-]/g, '') + '@gendy92.github.io';
            core.info(`login email for ${admin.username}: ${synthEmail} (profiles.email: ${admin.email})`);

            // Ideal case: an auth user already exists with profiles.id.
            let target = users.find(u => u.id === admin.id);
            if (target && target.email.toLowerCase() === synthEmail) {
              const updRes = await fetch(`${base}/auth/v1/admin/users/${target.id}`, {
                method: 'PUT',
                headers,
                body: JSON.stringify({ password: pw })
              });
              const text = await updRes.text();
              if (!updRes.ok) throw new Error(`GoTrue admin update failed: HTTP ${updRes.status} — ${text.slice(0, 200)}`);
              core.info(`Password updated on existing auth user ${target.id}.`);
            } else {
              // Remove conflicting users: same id wrong email, or same email wrong id.
              for (const u of users) {
                const wrongEmail = u.id === admin.id && u.email.toLowerCase() !== synthEmail;
                const wrongId = u.email.toLowerCase() === synthEmail && u.id !== admin.id;
                if (wrongEmail || wrongId) {
                  const delRes = await fetch(`${base}/auth/v1/admin/users/${u.id}`, { method: 'DELETE', headers });
                  core.info(`Removed mismatched auth user ${u.id} (${u.email}): HTTP ${delRes.status}.`);
                }
              }
              const createRes = await fetch(`${base}/auth/v1/admin/users`, {
                method: 'POST',
                headers,
                body: JSON.stringify({
                  id: admin.id,
                  email: synthEmail,
                  password: pw,
                  email_confirm: true,
                  user_metadata: { username: admin.username }
                })
              });
              const createText = await createRes.text();
              if (!createRes.ok) throw new Error(`GoTrue admin create failed: HTTP ${createRes.status} — ${createText.slice(0, 200)}`);
              target = JSON.parse(createText);
              core.info(`Created auth user ${target.email} with profiles.id ${target.id}.`);
            }

            core.info(`Admin password is now set for ${admin.username} (id ${admin.id}, ${synthEmail}).`);

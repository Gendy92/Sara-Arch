<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3d2e22">
<title>لا يوجد اتصال — سارة أبو العلا</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1a1a;
    color: #f0f0f0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    padding: 24px;
    text-align: center;
  }
  .card {
    background: #2a2a2a;
    border: 1px solid #3d3d3d;
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
  }
  .icon { font-size: 64px; margin-bottom: 16px; }
  h1 { margin: 0 0 12px; font-size: 1.5rem; color: #c4a97a; }
  p { margin: 0 0 24px; line-height: 1.6; color: #ccc; font-size: 15px; }
  button {
    background: linear-gradient(135deg, #c4a97a, #d4bc94);
    color: #14161f;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { opacity: 0.92; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>لا يمكن الوصول إلى النظام حاليًا. بعض البيانات قد تكون متاحة في وضع عدم الاتصال. سيتم المزامنة تلقائيًا عند استعادة الاتصال.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
